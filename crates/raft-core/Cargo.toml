[package]
name = "raft-core"
description = "Sans-IO Raft consensus state machine (no I/O, no clock, no threads)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Çekirdek hiçbir workspace crate'ine bağlanamaz (sim/checker/cli'yi bilmez); yalnızca onaylı dış
# crate'ler:
# - rand_chacha: seçim zaman aşımı, kurucuya verilen seed'den kurulan ChaCha8 akışından çekilir.
#   ChaCha8'in çıktısı platformlar ve sürümler arasında değer-kararlıdır.
# - thiserror: `ConfigError` (kütüphane crate'lerinde özel hata tipleri).
[dependencies]
rand_chacha = { workspace = true }
thiserror = { workspace = true }

# Mutasyon testi (Faz 5): her özellik çekirdeğe bilerek bir hata ekler; varsayılan derlemede
# hiçbiri yoktur ve CI `--all-features` kullanmaz. `docs/mutation-table.md` her birini yakalayan
# denetimi ve seed'i listeler; `scripts/check_mutations.sh` hepsinin hâlâ yakalandığını doğrular.
# Aynı anda en fazla bir mutasyon açılabilir (lib.rs'teki derleme zamanı denetimi).
[features]
mutation-no-election-restriction = []
mutation-commit-old-terms = []
mutation-forget-vote = []
mutation-truncate-on-append = []
mutation-skip-prev-log-term = []
mutation-apply-before-commit = []

[lints]
workspace = true
