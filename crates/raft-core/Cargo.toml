[package]
name = "raft-core"
description = "Sans-IO Raft consensus state machine (no I/O, no clock, no threads)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Çekirdek hiçbir workspace crate'ine bağlanamaz (sim/checker/cli'yi bilmez); yalnızca onaylı dış
# crate'ler:
# - rand_chacha: seçim zaman aşımı, kurucuya verilen seed'den kurulan ChaCha8 akışından çekilir.
#   ChaCha8'in çıktısı platformlar ve sürümler arasında değer-kararlıdır.
# - thiserror: `ConfigError` (kütüphane crate'lerinde özel hata tipleri).
[dependencies]
rand_chacha = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
