[package]
name = "sim"
description = "Deterministic simulation harness for raftsim (virtual time, event queue, seeded network, trace hash)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raft-core = { workspace = true }
checker = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }

# Mutasyon testi (Faz 5): çekirdeğin mutasyonları buradan geçirilir (cli de sim üzerinden açar),
# `mutation-no-dedup` ise simülatörün kendi durum makinesine aittir. Varsayılan derlemede hiçbiri
# yoktur; aynı anda en fazla biri açılabilir (lib.rs'teki derleme zamanı denetimi).
[features]
mutation-no-election-restriction = ["raft-core/mutation-no-election-restriction"]
mutation-commit-old-terms = ["raft-core/mutation-commit-old-terms"]
mutation-forget-vote = ["raft-core/mutation-forget-vote"]
mutation-truncate-on-append = ["raft-core/mutation-truncate-on-append"]
mutation-skip-prev-log-term = ["raft-core/mutation-skip-prev-log-term"]
mutation-apply-before-commit = ["raft-core/mutation-apply-before-commit"]
mutation-read-without-quorum = ["raft-core/mutation-read-without-quorum"]
mutation-read-before-term-commit = ["raft-core/mutation-read-before-term-commit"]
mutation-install-stale-snapshot = ["raft-core/mutation-install-stale-snapshot"]
mutation-no-dedup = []
mutation-snapshot-without-sessions = []

[lints]
workspace = true
