name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# En az yetki ilkesi: iş akışı yalnızca kodu okur; hiçbir şeye yazmaz.
permissions:
  contents: read

# Aynı PR'a art arda push edilince eski koşu iptal edilir (yalnızca son hâl önemlidir). main'e
# yapılan push'larda iptal YOK: her commit'in kendi CI sonucu kalsın, geçmişte "hangi commit
# yeşildi" sorusu cevapsız kalmasın.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Phase gates
    # Runner imajı sabit bir sürüme bağlanır: `ubuntu-latest` etiketi zaman zaman yeni bir sürüme
    # taşınır (ör. Ubuntu 26) ve shellcheck, jq gibi araçların sürümleri habersizce değişebilir.
    # Sürüm yükseltmek bilinçli bir değişiklik olmalı.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Eylem, değiştirilebilir bir sürüm etiketine (v7) değil tam bir commit SHA'sına sabitlenir:
      # etiket sonradan başka bir commit'e taşınabilir (tedarik zinciri saldırısı), SHA taşınamaz.
      # persist-credentials: false — checkout varsayılan olarak GITHUB_TOKEN'ı iş süresince
      # .git/config'e yazar; bu durumda sonraki adımlarda çalışan her kod (build.rs, testler,
      # ileride eklenecek bağımlılıklar) token'ı okuyabilir. Bu iş akışı hiçbir yere push
      # etmediği için token'ı diskte tutmaya gerek yok.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml'daki kanal/bileşen/profil AÇIKÇA kurulur: argümansız
      # `rustup toolchain install` dosyadaki pini okur. Örtük (implicit) kurulum rustup 1.29'da
      # uyarı basar ve rustup 1.30'da proxy dışı yollarda kaldırılıyor.
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      # Ucuz betik kontrolleri derlemeden ÖNCE çalışır (hızlı başarısızlık): saniyeler süren bir
      # tarama, dakikalar süren bir derlemeden önce hata verirse geri bildirim döngüsü kısalır.
      # Betikler de birer CI kapısı olduğu için önce kendileri lint'lenir (shellcheck runner
      # imajında hazır gelir).
      - name: Lint scripts (shellcheck)
        run: shellcheck scripts/*.sh
      - name: Forbidden patterns in raft-core
        run: ./scripts/check_forbidden.sh
      # Simülatör de determinizm için kritik: aynı yasaklar (gerçek saat, entropi, Hash* koleksiyonlar,
      # iş parçacıkları, G/Ç) onun için de geçerli.
      - name: Forbidden patterns in sim
        run: ./scripts/check_forbidden.sh crates/sim
      - name: Forbidden-pattern guard self-test
        run: ./scripts/test_check_forbidden.sh
      - name: Crate dependencies (direction + allowlist)
        run: ./scripts/check_deps.sh
      - name: Format
        run: cargo fmt --all -- --check
      # rustfmt yorumları sarmaz; Türkçe yorumlar karakterle (bayt değil) 100 sütunu aşmamalı.
      - name: Line length (100 characters)
        run: ./scripts/check_line_length.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Testler bir de tek iş parçacığıyla koşar: determinizm, test çalıştırıcısının paralelliğine
      # bağlı olmamalı. İkisinde de geçmesi, testlerin paylaşılan bir duruma dayanmadığına dair ek
      # bir kanıttır.
      - name: Test (single-threaded)
        run: cargo test --workspace --locked -- --test-threads=1
      # Clippy doctest'leri ve rustdoc bağlantılarını denetlemez; bozuk bir [`Tip`] bağlantısı ya da
      # uyarılı bir örnek burada yakalanır.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  fuzz:
    name: Fuzz
    # Her push'ta profil başına 1000 seed: her biri rastgele bir hata programı (çökme, lideri
    # çökertme, yeniden başlatma, bölünme, iyileşme, kayıp oranı değişimi) ve istemci iş yükü koşar;
    # HER olaydan sonra invariant'lar, sonda linearizability denetlenir. Başarısız bir seed, yeniden
    # üretme komutuyla basılır. Kapılardan ayrı bir iştir: yalnızca release derlemesi gerekir ve
    # kapılarla paralel koşar; birinin süresi ötekinin zaman aşımını tüketmez.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Release derlemesi (yapı profilleri değiştirilmeden) debug derlemesinden onlarca kat
      # hızlıdır; derleme ayrı bir adımdır ki adım süreleri derlemeyi ve taramayı ayrı göstersin.
      - name: Build (release)
        run: cargo build --release --locked -p cli
      - name: Fuzz 1000 seeds (chaos profile)
        run: cargo run --release --locked -p cli -- fuzz --seeds 0..1000 --threads 4
      - name: Fuzz 1000 seeds (figure8 profile)
        run: >-
          cargo run --release --locked -p cli --
          fuzz --seeds 0..1000 --threads 4 --profile figure8
      # Okumaların çoğu log'a yazılmadan (ReadIndex) cevaplanır; liderler sık devrilir.
      - name: Fuzz 1000 seeds (reads profile)
        run: >-
          cargo run --release --locked -p cli --
          fuzz --seeds 0..1000 --threads 4 --profile reads
      # Her düğüm 16 girdide bir snapshot alır ve log'unu sıkıştırır (§7).
      - name: Fuzz 1000 seeds (snapshots profile)
        run: >-
          cargo run --release --locked -p cli --
          fuzz --seeds 0..1000 --threads 4 --profile snapshots

  mutations:
    name: Mutations
    # Mutasyon tablosu (docs/mutation-table.md) her push'ta doğrulanır: her mutasyon kendi
    # özelliğiyle derlenir ve tablodaki seed'de tablodaki denetime takılmalıdır; aynı seed
    # özelliksiz derlemede geçmelidir. Her satır ayrı bir derleme olduğu için kapılardan ayrı bir
    # işte koşar.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Every mutation is caught as listed
        run: ./scripts/check_mutations.sh
      # README'deki zaman çizelgesi (docs/figure8-seed3.svg) koddan yeniden çizilir ve depodakiyle
      # bayt bayt aynı olmalıdır: resim, kodun bugün ürettiğinden sessizce ayrışamaz. Mutant
      # derleme yukarıdaki adımın önbelleğini (target/mutations) kullanır.
      - name: The README's timeline is what the code draws
        run: ./scripts/check_timeline.sh
